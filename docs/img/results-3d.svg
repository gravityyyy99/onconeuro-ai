lvetica, Arial, sans-serif" >Found (recall)</text><text x="866" y="182" font-size="12.5" fill="#a3a198" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >of all REAL cases, how many it caught</text><rect x="840" y="208" width="16" height="16" rx="3" fill="#9bb27a"/><text x="866" y="221" font-size="14.5" fill="#f5f4ee" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Correct when it speaks (precision)</text><text x="866" y="240" font-size="12.5" fill="#a3a198" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >when it names a group, how often it is right</text><rect x="840" y="285" width="320" height="140" rx="14" fill="#2a2927" stroke="#d97757" stroke-width="1.5"/><text x="860" y="316" font-size="17" fill="#d97757" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >The honest part</text><text x="860" y="344" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >It finds only 68% of real gliomas.</text><text x="860" y="366" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Many get called meningioma instead.</text><text x="860" y="388" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Missing a tumor is the costly mistake,</text><text x="860" y="410" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >so this is NOT a medical tool.</text></svg>