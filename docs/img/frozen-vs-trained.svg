<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="Frozen versus trained numbers"><rect width="1100" height="330" rx="20" fill="#1f1e1d"/><text x="40" y="48" font-size="28" fill="#f5f4ee" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Why this trains in minutes, not days</text><text x="40" y="74" font-size="13" fill="#a3a198" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Almost everything the network knows was learned by someone else, on over a million photos. I only trained the very last step.</text><rect x="40" y="110" width="1020" height="64" rx="14" fill="#4b6079"/><text x="60" y="148" font-size="18" fill="#f5f4ee" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >11,176,512 numbers: FROZEN (kept exactly as ImageNet taught them)</text><rect x="1055" y="110" width="5" height="64" rx="2" fill="#d97757"/><line x1="1057" y1="180" x2="1057" y2="214" stroke="#d97757" stroke-width="2"/><rect x="700" y="214" width="360" height="86" rx="14" fill="#2a2927" stroke="#d97757" stroke-width="1.5"/><text x="720" y="244" font-size="20" fill="#d97757" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >2,052 numbers: TRAINED</text><text x="720" y="270" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >0.018% of the whole network.</text><text x="720" y="290" font-size="13" fill="#a3a198" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >512 features x 4 groups + 4 offsets</text><text x="40" y="250" font-size="18" fill="#f5f4ee" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Like hiring an expert photographer</text><text x="40" y="276" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >and teaching them only to recognize four kinds of picture,</text><text x="40" y="296" font-size="14" fill="#d6d4cb" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >instead of teaching a baby to see from zero.</text></svg>